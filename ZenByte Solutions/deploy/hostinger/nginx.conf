user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    upstream backend {
        server backend:8080;
    }

    # HTTP — zenbytesolutions.in (redirects to HTTPS once SSL is enabled below)
    server {
        listen 80;
        server_name zenbytesolutions.in www.zenbytesolutions.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Uncomment after SSL is issued to force HTTPS:
        # return 301 https://zenbytesolutions.in$request_uri;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTTPS — uncomment after: certbot certonly --standalone -d zenbytesolutions.in -d www.zenbytesolutions.in
    # server {
    #     listen 443 ssl http2;
    #     server_name zenbytesolutions.in www.zenbytesolutions.in;
    #
    #     ssl_certificate /etc/letsencrypt/live/zenbytesolutions.in/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/zenbytesolutions.in/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     location / {
    #         root /usr/share/nginx/html;
    #         try_files $uri $uri/ /index.html;
    #     }
    #
    #     location /api {
