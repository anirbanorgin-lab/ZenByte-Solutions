version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zenbyte-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zenbyte_db}
      MYSQL_USER: ${MYSQL_USER:-zenbyte}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - zenbyte-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenbyte-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -Xms256m}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zenbyte-network

  nodejs:
    build:
      context: ./nodejs
      dockerfile: Dockerfile
    container_name: zenbyte-nodejs
    restart: unless-stopped
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JAVA_API_URL: http://backend:8080
      FRONTEND_PATH: /app/frontend
      DOMAIN: ${DOMAIN:-zenbytesolutions.in}
      CORS_ORIGINS: https://zenbytesolutions.in,https://www.zenbytesolutions.in,http://zenbytesolutions.in
    volumes:
      - ./frontend:/app/frontend:ro
    depends_on:
      - backend
    networks:
      - zenbyte-network

volumes:
  mysql_data:
  certbot_www:
  certbot_certs:

networks:
  zenbyte-network:
    driver: bridge
